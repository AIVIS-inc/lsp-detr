__include__: [
  '../dataset/coco_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/dome_hgnetv2.yml',
]

output_dir: ./output/S2

checkpoint_freq: 1

eval_spatial_size: [2048, 2048] # h w

DOME:
  backbone: HGNetv2

HGNetv2:
  name: 'B2'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

DomeTransformer:
  num_layers: 4  # 5 6
  eval_idx: -1  # -2 -3
  feat_channels: [128, 128, 128]
  hidden_dim: 128
  dim_feedforward: 512
  feat_strides: [8, 16, 32]
  num_points: [8, 3, 1]
  num_levels: 3
  min_num_select: 300
  max_num_select: 2000

HybridEncoder:
  in_channels: [384, 768, 1536]
  feat_strides: [8, 16, 32]
  use_encoder_idx: [2] # Only not deformable
  use_hybrid: True
  num_encoder_layers: 1
  use_deformable: False
  enc_n_points: 6 # Only deformable
  hidden_dim: 128
  depth_mult: .67
  expansion: 1
  num_feature_levels: 4
  use_defe: True
  defe_type: 'light'
  use_mwas: True # Only if use_defe
  mwas_window_size: 8  # Changed from 5 to 8 for 1024 resolution (128÷8=16)

DomeCriterion:
  defe_density_map_weight: 1

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00025
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00025
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.00025
  betas: [0.9, 0.999]
  weight_decay: 0.000125


lr_scheduler:
  type: MultiStepLR
  milestones: [64, 80]
  gamma: 0.8


# Increase to search for the optimal ema
epoches: 96